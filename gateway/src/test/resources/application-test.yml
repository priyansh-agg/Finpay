# Integration tests run against the local Postgres 'finpay_test' database
# (Docker/Testcontainers not required on this machine).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finpay_test
    username: finpay
    password: finpay
    hikari:
      maximum-pool-size: 32
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    clean-disabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1000ms
      connect-timeout: 1000ms

finpay:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
    ttl-minutes: 60
    issuer: finpay-gateway
  apikey:
    pepper: test-pepper
  ratelimit:
    capacity: 100000
    refill-per-second: 100000
  simulator:
    mode: DETERMINISTIC
  risk:
    auto-capture-max: 15
  outbox:
    poll-interval-ms: 300
    max-attempts: 3
    backoff-base-ms: 150

logging:
  level:
    org.springframework.orm.jpa: WARN
    org.hibernate: WARN
